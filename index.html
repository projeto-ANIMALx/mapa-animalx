        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;

        /* --- LAYOUT MOBILE  --- */
        @media (max-width: 768px) {
          
            html, body {
                height: auto !important; 
                min-height: 100vh !important;
                overflow-y: auto !important; 
                overflow-x: hidden !important;
                display: block !important;
            }

            .dashboard-animalx {
                display: flex !important;
                flex-direction: column !important;
                height: auto !important;
                overflow: visible !important;
            }

            /*  CABEÇALHO E FERRAMENTAS */
            .header-animalx {
                padding: 15px !important;
            }

            .toolbar-animalx {
                display: flex !important;
                flex-direction: column !important;
                gap: 15px !important;
                padding: 10px 15px !important;
                height: auto !important;
            }

            /* CORRIGIR OS BOTÕES  */
            .toolbar-esq {
                display: flex !important;
                flex-wrap: wrap !important; /* Em vez de scroll horizontal, os botões descem de linha se não couberem */
                gap: 8px !important;
                justify-content: center !important;
            }

            .btn-filtro {
                flex: 1 1 auto !important; /* Deixa o botão crescer ou encolher */
                white-space: normal !important; /* Permite que o texto se divida em 2 linhas */
                text-align: center !important;
                padding: 8px 12px !important;
                height: auto !important;
                font-size: 0.9rem !important;
            }

            /* 5. MENUS DROPDOWN E PESQUISA */
            .toolbar-centro, .toolbar-dir {
                display: flex !important;
                flex-direction: column !important;
                width: 100% !important;
                gap: 10px !important;
            }

            .toolbar-dir .dropdown-multi, .toolbar-dir .btn-dropdown {
                width: 100% !important;
                height: auto !important;
                white-space: normal !important;
            }

            /* MAPA */
            .main-animalx {
                display: flex !important;
                flex-direction: column !important;
                height: auto !important;
            }

            #mapa-container {
                width: 100% !important;
                height: 50vh !important; /* O mapa ocupa metade do ecrã */
                min-height: 350px !important;
                position: relative !important;
                order: 1 !important;
                z-index: 1 !important;
            }

            /* 7. LINHA DO TEMPO E RESULTADOS  */
            .sidebar-animalx {
                display: flex !important;
                flex-direction: column !important;
                width: 100% !important;
                height: auto !important;
                order: 2 !important;
                overflow: visible !important;
            }

            .timeline-container {
                padding: 20px 15px !important;
            }

            }
           /* --- CORREÇÃO DOS POPUPS --- */
            
            
            .leaflet-popup {
                width: 280px !important; 
                margin-bottom: 15px !important;
            }
            .leaflet-popup-content-wrapper {
                padding: 0 !important;
                border-radius: 12px !important;
                background: transparent !important; 
                box-shadow: none !important;
                overflow: visible !important;
            }

                overflow-y: auto !important; 
                overflow-x: hidden !important;

            .cartao-popup {

                border-radius: 4px;
            }
            .cartao-direita::-webkit-scrollbar-track {
                background: #f1f1f1; 
            }
        }

        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:27, minZoom:1
        }).setView([38.7500, -9.2300], 11);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        // --- INÍCIO DA LÓGICA DE SIMBOLOGIA DINÂMICA ---
        function getTipoRegistoSVG(props) {
                    // 1. Regra mais específica primeiro (Ciência Cidadã)
                    if (props.layer === 'Registos obtidos através da Ação de Ciência Cidadã') return 'images/marcadores_svg/pin_ciencia_cidada.svg';
                    
                    // 2. Regras gerais a seguir
                    if (props.conjunto === 'ANIMALx Espaços') return 'images/marcadores_svg/pin_espaços.svg';
                    if (props.conjunto === 'ANIMALx Representações') return 'images/marcadores_svg/pin_representacoes.svg';
                    
                    return ''; 
                }
        function getCronologiaSVG(props) {
            if (props.primeira_d === 'Indeterminada') return 'images/marcadores_svg/indeterminada.svg';
            const inicio = props.ano_inicio;
            const fim = props.ano_fim;
            if (inicio <= 1200 && fim >= 1101) return 'images/marcadores_svg/seculo_12.svg';
            if (inicio <= 1300 && fim >= 1201) return 'images/marcadores_svg/seculo_13.svg';
            if (inicio <= 1400 && fim >= 1301) return 'images/marcadores_svg/seculo_14.svg';
            if (inicio <= 1500 && fim >= 1401) return 'images/marcadores_svg/seculo_15.svg';
            if (inicio <= 1600 && fim >= 1501) return 'images/marcadores_svg/seculo_16.svg';
            if (inicio <= 1700 && fim >= 1601) return 'images/marcadores_svg/seculo_17.svg';
            if (inicio <= 1800 && fim >= 1701) return 'images/marcadores_svg/seculo_18.svg';
            if (inicio <= 1900 && fim >= 1801) return 'images/marcadores_svg/seculo_19.svg';
            if (inicio <= 2000 && fim >= 1901) return 'images/marcadores_svg/seculo_20.svg';
            if (inicio <= 2100 && fim >= 2001) return 'images/marcadores_svg/seculo_21.svg';
            return '';
        }

        function getTipologiaSVG(props) {
            const tipologia = props.tipologia || '';
            if (tipologia.includes('Consumo')) return 'images/marcadores_svg/icone_consumo.svg';
            if (tipologia.includes('Selvage')) return 'images/marcadores_svg/icone_selvagem.svg';
            if (tipologia.includes('Companhia')) return 'images/marcadores_svg/icone_companhia.svg';
            if (tipologia.includes('Trabalho')) return 'images/marcadores_svg/icone_trabalho.svg';
            if (tipologia.includes('Exposição')) return 'images/marcadores_svg/icone_exposiçãoeespetaculo.svg';
            if (tipologia.includes('Conhecimento')) return 'images/marcadores_svg/icone_conhecimentoesaude.svg';
            if (tipologia.includes('Simbólico')) return 'images/marcadores_svg/icone_simbolico.svg';
            return '';
        }

        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

            function atualizarFiltros() {
                var termoPesquisa = document.getElementById('pesquisa-especie').value.toLowerCase().trim();

                            // 1. Divide a pesquisa por vírgulas e limpa espaços extra
                            var termos = termoPesquisa.split(',').map(t => t.trim()).filter(t => t !== "");

                            if (!corresponde) return false;

                    }

                            if (sec === 'Indeterminada') return primeira_d === 'Indeterminada';
                            var s = parseInt(sec);
                            if (s === 12) return (inicio <= 1200 && fim >= 1101);
                            if (s === 13) return (inicio <= 1300 && fim >= 1201);
                            if (s === 14) return (inicio <= 1400 && fim >= 1301);
                            if (s === 15) return (inicio <= 1500 && fim >= 1401);
                            if (s === 16) return (inicio <= 1600 && fim >= 1501);
                            if (s === 17) return (inicio <= 1700 && fim >= 1601);
                            if (s === 18) return (inicio <= 1800 && fim >= 1701);
                            if (s === 19) return (inicio <= 1900 && fim >= 1801);
                            if (s === 20) return (inicio <= 2000 && fim >= 1901);
                            if (s === 21) return (inicio <= 2100 && fim >= 2001);
                            return false;
                        });
                        if (!passaSeculo) return false;
                    }
                    return true;
                });

                        featuresUnicas.push(f);

                });

                var grupos = { 'ANIMALx Espaços': [], 'ANIMALx Representações': [], 'Registos obtidos através da Ação de Ciência Cidadã': [], 'Outro': [] };
                featuresUnicas.forEach(function(f) {
                    grupos[getCategoriaRegisto(f.properties) || 'Outro'].push(f);
                });

                var featuresMisturadas = [];
                var categorias = Object.keys(grupos);
                var haMaisPontos = true;
                while (haMaisPontos) {
                    haMaisPontos = false;
                    categorias.forEach(function(cat) {
                        if (grupos[cat].length > 0) {
                            featuresMisturadas.push(grupos[cat].shift());
                            haMaisPontos = true;
                        }
                    });
                }

                // --- 3. CRIAR CAMADA BASE ---
                var camadaMestre = L.geoJSON({ type: "FeatureCollection", features: featuresMisturadas }, {

                    var classeImagem = temImagem ? "preview-img-foto" : "preview-img-logo";
                    
                    var textoData = props.primeira_d === 'Indeterminada' ? "Indeterminada" : (props.ano_inicio === props.ano_fim ? (props.ano_inicio || '') : (props.ano_inicio || '') + " - " + (props.ano_fim || ''));

                                    <span>${textoData}</span>

                            </div>

                    `);

                    var passaTempo = true;
                    if (anoSlider > 1169) {
                        if (props.primeira_d === 'Indeterminada') {
                            passaTempo = false;

                            var strFim = String(props.ud_QGIS || "");
                            var inicioSlider = strInicio.match(/\d{4}/) ? parseInt(strInicio.match(/\d{4}/)[0]) : (props.ano_inicio ? parseInt(props.ano_inicio) : 0);
                            var fimSlider = strFim.match(/\d{4}/) ? parseInt(strFim.match(/\d{4}/)[0]) : (props.ano_fim ? parseInt(props.ano_fim) : 9999);
                            
                            if (!(anoSlider >= inicioSlider && anoSlider <= fimSlider)) passaTempo = false;

            atualizarFiltros();

            // --- FUNÇÃO PARA ABRIR POPUP A PARTIR DA SIDEBAR ---
            window.focarAbrirPopup = function(layerId) {
                var layer = window.camadasAtuais[layerId];
                if (layer) {
                    if (!marcadoresCluster.hasLayer(layer)) {
                        marcadoresCluster.addLayer(layer);
                    }
                    marcadoresCluster.zoomToShowLayer(layer, function() {
                        layer.openPopup();
                    });
                }
            };
           

            // --- CARREGAR CARTOGRAFIA HISTÓRICA VIA LOCAL ---

            if (!map.getPane('pane_historico')) {
                map.createPane('pane_historico');
                map.getPane('pane_historico').style.zIndex = 401;
                map.getPane('pane_historico').style.mixBlendMode = 'multiply';
            }

            // --- 2A. TINOCO (1650) ---
            var limitesTinoco = [
                [38.702778723, -9.152608446], 
                [38.721267178, -9.113083449]
            ];
            var cartografiaTinocoLocal = L.imageOverlay('cartografia/cartografiaTinoco.png', limitesTinoco, {
                opacity: 0.7,
                pane: 'pane_historico'
            });

            // --- 2B. PLANTA TOPONÍMICA ---
            var limitesToponimica = [
                [38.677890419, -9.220014269], 
                [38.751844237, -9.061914281] 
            ];
            var cartografiaToponimicaLocal = L.imageOverlay('cartografia/plantaToponimica.png', limitesToponimica, {
                opacity: 0.7,
                pane: 'pane_historico'
            });

            // --- 2C. FOLQUE (1856-1858) ---
            var limitesFolque = [
                [38.677890419, -9.220014269], 
                [38.751844237, -9.061914281] 
            ];
            var cartografiaFolqueLocal = L.imageOverlay('cartografia/cartografiaFolque.png', limitesFolque, {
                opacity: 0.7,
                pane: 'pane_historico'
            });



        // --- 3. MENU DE CONTROLO (MOVIDO PARA A SIDEBAR) ---
            var camadasSobreposicao = {
                "Planta de Lisboa, João Nunes Tinoco (1650)": cartografiaTinocoLocal,
                "Planta Topográfica de Lisboa (1758)": cartografiaToponimicaLocal,
                "Carta Topográfica de Lisboa, Filipe Folque (1856-1858)": cartografiaFolqueLocal
            };

            var controloCamadas = L.control.layers(null, camadasSobreposicao, {
                collapsed: false
            });

            controloCamadas.addTo(map);

            // O Truque de Magia (Com Rede de Segurança)
            var divDestino = document.getElementById('camadas-leaflet-aqui');
            
            if (divDestino) {
                divDestino.appendChild(controloCamadas.getContainer());
            } else {
                console.error("FALHA: Não encontrei a <div id='camadas-leaflet-aqui'> no HTML para colocar o menu!");
            }

            // --- COLAPSAR/EXPANDIR MENU DE CARTOGRAFIA ---
            var tituloCartografia = document.getElementById('toggle-cartografia');
            var conteudoCartografia = document.getElementById('camadas-leaflet-aqui');
            var setaCartografia = document.getElementById('seta-cartografia');

            if (tituloCartografia) {
                tituloCartografia.addEventListener('click', function() {
                    // Alterna entre mostrar e esconder as opções
                    conteudoCartografia.classList.toggle('escondido');
                    // Roda a setinha para cima ou para baixo
                    setaCartografia.classList.toggle('aberto');
                });
            }

            // --- ESCONDER ECRÃ DE CARREGAMENTO ---
            window.addEventListener('load', function() {
                var loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    // Reduz a opacidade para criar um efeito de transição suave
                    loadingScreen.style.opacity = '0';
                    
                    // Remove o elemento do HTML após meio segundo (o tempo da transição)
                    setTimeout(function() {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
            });
        </script>   

    </body>
</html>
